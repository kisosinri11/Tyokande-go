<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直感で印象を答えろ！直感でGO！</title>
  <style>
    /* ベーススタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 840px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 20px 40px 20px; /* フッター分の下部余白 */
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* オーバーレイ（スタート画面・結果画面など） */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(18, 18, 18, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      text-align: center;
      padding: 20px;
      transition: opacity 0.3s ease;
    }

    .overlay.hidden {
      display: none;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #00e676;
      line-height: 1.3;
    }

    .powered-by {
      font-size: 0.95rem;
      color: #bbbbbb;
      margin-bottom: 24px;
    }

    .btn {
      background: #00e676;
      color: #121212;
      border: none;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 4px 12px rgba(0,230,118,0.3);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: #333;
      color: #fff;
      margin-top: 10px;
    }

    /* タイトル演出用オーバーレイ */
    #title-drop-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #title-drop-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #title-drop-overlay h2 {
      font-size: 2.2rem;
      color: #00e676;
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* クイズ画面コンテンツ */
    .question-header {
      font-size: 1.2rem;
      color: #aaaaaa;
      text-align: center;
      margin-top: 10px;
    }

    .question-title {
      font-size: 1.4rem;
      margin: 10px 0;
      text-align: center;
    }

    .image-container {
      width: 100%;
      height: 250px;
      background: #2a2a2a;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .option-btn {
      background: #2c2c2c;
      border: 2px solid #3d3d3d;
      color: #ffffff;
      padding: 14px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s, border-color 0.2s;
    }

    .option-btn:hover {
      background: #3d3d3d;
      border-color: #00e676;
    }

    /* 常時表示フッター */
    .footer-credits {
      position: absolute;
      bottom: 8px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.7rem;
      color: #777777;
      z-index: 50;
      pointer-events: none;
    }

    /* 管理用設定画面 */
    .admin-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #181818;
      z-index: 30;
      padding: 20px;
      overflow-y: auto;
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #ccc;
    }

    .input-group input, .input-group textarea {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div id="game-container">

    <!-- スタート画面 -->
    <div id="start-overlay" class="overlay">
      <h1>直感で印象を答えろ！<br>直感でGO！</h1>
      <div class="powered-by">Powered by 基礎心理学ゼミ11班</div>
      <button class="btn" onclick="startGame()">スタート</button>
      <button class="btn btn-secondary" onclick="openAdmin()" style="font-size: 0.85rem; margin-top: 25px;">管理者設定</button>
    </div>

    <!-- スタート直後の演出用 -->
    <div id="title-drop-overlay">
      <h2>GAME START!</h2>
    </div>

    <!-- メインクイズ画面 -->
    <div class="question-header">
      <span id="q-number">第 1 問</span>
    </div>

    <div class="question-title" id="q-title">問題を読み込み中...</div>

    <div class="image-container">
      <img id="q-image" src="" alt="問題画像" style="display: none;">
      <span id="img-placeholder" style="color: #666;">No Image</span>
    </div>

    <div class="options-container" id="options-box">
      <!-- 選択肢が動的に挿入されます -->
    </div>

    <!-- 結果画面 -->
    <div id="result-overlay" class="overlay hidden">
      <h1>全問終了！</h1>
      <p style="margin-bottom: 20px;">回答お疲れ様でした。<br>結果がスプレッドシートに保存されました。</p>
      <button class="btn" onclick="resetToStart()">最初に戻る</button>
    </div>

    <!-- 常時画面最下部に表示されるコピーライト -->
    <div class="footer-credits">
      2026 基礎心理学ゼミ11班 / Google Gemini / Open AI Chat GPT
    </div>

    <!-- 管理者設定画面 -->
    <div id="admin-panel" class="admin-panel">
      <h2 style="margin-bottom: 15px;">管理者設定</h2>
      <div class="input-group">
        <label>GAS WEBアプリ URL</label>
        <input type="text" id="admin-gas-url" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="btn" onclick="saveAdminSettings()">設定を保存</button>
      <button class="btn btn-secondary" onclick="closeAdmin()">閉じる</button>
    </div>

  </div>

  <script>
    // --- グローバル変数 ---
    let questions = [
      {
        id: "Q1",
        title: "この印象は？",
        image: "https://via.placeholder.com/400x250/2196f3/ffffff?text=Sample+Image+1",
        options: ["かわいい", "こわい", "おもしろい", "その他"]
      },
      {
        id: "Q2",
        title: "どんな雰囲気を感じますか？",
        image: "https://via.placeholder.com/400x250/ff9800/ffffff?text=Sample+Image+2",
        options: ["明るい", "暗い", "楽しそう", "落ち着いている"]
      }
    ];

    let currentQIndex = 0;
    let localAnswers = [];
    let gameStarted = false;

    // 設定保持用のGAS URL（デフォルトまたはローカルストレージから読み込み）
    let gasWebAppUrl = localStorage.getItem('gas_app_url') || '';

    // --- サウンド効果演出（Web Audio API） ---
    function play8BitTitleSE() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {
        console.log("Audio play error", e);
      }
    }

    function playAudioBGM() {
      // 必要に応じてBGM処理を追加可能
    }

    // --- GAS通信処理 ---
    async function fetchQuestionsFromGAS() {
      if (!gasWebAppUrl) return;
      try {
        const response = await fetch(gasWebAppUrl + '?action=getQuestions');
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data) && data.length > 0) {
            questions = data;
          }
        }
      } catch (err) {
        console.error("問題の取得に失敗しました（初期データを使用します）:", err);
      }
    }

    async function sendAnswersToGAS() {
      if (!gasWebAppUrl) {
        console.log("GASのURLが設定されていません:", localAnswers);
        return;
      }
      try {
        await fetch(gasWebAppUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ answers: localAnswers })
        });
        console.log("送信完了");
      } catch (err) {
        console.error("送信失敗:", err);
      }
    }

    // --- ゲーム進行制御 ---
    function startGame() {
      if (gameStarted) return;
      gameStarted = true;
      localAnswers = [];

      // ボタンを押した瞬間に即座にスタート画面を非表示にする
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('result-overlay').classList.add('hidden');

      playAudioBGM();
      play8BitTitleSE();

      const titleDropOverlay = document.getElementById('title-drop-overlay');
      titleDropOverlay.classList.add('active');

      // 通信は裏で非同期実行
      fetchQuestionsFromGAS();

      setTimeout(() => {
        titleDropOverlay.classList.remove('active');
        currentQIndex = 0;
        loadQuestion(0);
      }, 1500);
    }

    function loadQuestion(index) {
      if (index >= questions.length) {
        finishGame();
        return;
      }

      const q = questions[index];
      document.getElementById('q-number').innerText = `第 ${index + 1} 問 / 全 ${questions.length} 問`;
      document.getElementById('q-title').innerText = q.title;

      const imgElem = document.getElementById('q-image');
      const placeholder = document.getElementById('img-placeholder');

      if (q.image) {
        imgElem.src = q.image;
        imgElem.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        imgElem.style.display = 'none';
        placeholder.style.display = 'block';
      }

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      q.options.forEach(optText => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.onclick = () => selectOption(q.id || `Q${index+1}`, q.title, optText);
        optionsBox.appendChild(btn);
      });
    }

    function selectOption(qId, qTitle, selectedText) {
      localAnswers.push({
        questionId: qId,
        questionTitle: qTitle,
        answer: selectedText,
        timestamp: new Date().toISOString()
      });

      currentQIndex++;
      loadQuestion(currentQIndex);
    }

    function finishGame() {
      sendAnswersToGAS();
      document.getElementById('result-overlay').classList.remove('hidden');
    }

    function resetToStart() {
      gameStarted = false;
      document.getElementById('result-overlay').classList.add('hidden');
      document.getElementById('start-overlay').style.display = 'flex';
    }

    // --- 管理者パネル ---
    function openAdmin() {
      document.getElementById('admin-gas-url').value = gasWebAppUrl;
      document.getElementById('admin-panel').classList.add('active');
    }

    function closeAdmin() {
      document.getElementById('admin-panel').classList.remove('active');
    }

    function saveAdminSettings() {
      const url = document.getElementById('admin-gas-url').value.trim();
      gasWebAppUrl = url;
      localStorage.setItem('gas_app_url', url);
      alert('設定を保存しました。');
      closeAdmin();
    }

    // 初回ページロード時に背景で事前ロード
    window.onload = () => {
      fetchQuestionsFromGAS();
    };
  </script>
</body>
</html>
