<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ゲーム画面</title>
  <style>
    /* 基本レイアウト：画面全体に配置 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: manipulation;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1100px;
      max-height: 800px;
      background: #000;
      border: 6px solid #fff;
      box-shadow: 0 0 50px rgba(255,255,255,0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* スマホなど画面幅が狭い環境（768px以下）の場合のレイアウト調整 */
    @media screen and (max-width: 768px) {
      #game-container {
        width: 100vw;
        height: 100vw !important; /* スマホでは幅いっぱいの正方形（1:1）にする */
        max-height: 100vh;
        border-width: 3px;
        box-shadow: none;
      }
    }

    /* 内部のゲーム表示エリアなどのサンプルスタイル */
    .game-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      width: 80%;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="game-screen">
      <h2>ゲームタイトル</h2>
      <p>下の入力欄をタップしてキーボードを表示してみてください。</p>
      <input type="text" placeholder="ここに文字を入力...">
    </div>
  </div>

  <script>
    // --- スマホキーボード対応 (Visual Viewport API) ---
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        const container = document.getElementById('game-container');
        
        // PCなど画面幅が広い場合のみ、ビューポートの高さに合わせて高さを調整
        if (window.innerWidth > 768) {
          container.style.height = window.visualViewport.height + 'px';
        }
        
        // キーボード表示時に画面がズレるのを防ぐ
        window.scrollTo(0, 0);
      });
    }
  </script>

</body>
</html>
