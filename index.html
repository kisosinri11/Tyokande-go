<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>直感で印象yを答えろ！直感でGO！</title>
  <!-- 8bit風フォント（DotGothic16） -->
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      image-rendering: pixelated;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'DotGothic16', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1000px;
      max-height: 750px;
      background: #000;
      border: 4px solid #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #bg-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* レトロボタン */
    .retro-btn {
      font-family: 'DotGothic16', monospace;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #e60012;
      border: 4px solid #fff;
      box-shadow: 4px 4px 0px #000, inset -4px -4px 0px #800000;
      padding: 8px 20px;
      cursor: pointer;
      text-shadow: 2px 2px 0px #000;
      transition: transform 0.05s, background-color 0.1s;
      pointer-events: auto !important;
    }
    .retro-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000, inset -2px -2px 0px #800000;
    }
    .retro-btn:hover { background-color: #ff3344; }

    /* スタート画面 */
    .start-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      border: 8px solid #fff;
      pointer-events: auto !important;
    }

    /* リザルト画面 */
    .result-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border: 8px solid #fff;
      pointer-events: auto !important;
    }

    .start-title {
      font-size: 28px;
      color: #f8b800;
      text-shadow: 4px 4px 0px #000, -2px -2px 0px #fff;
      letter-spacing: 2px;
      text-align: center;
    }

    .start-subtitle {
      font-size: 16px;
      color: #00f0f0;
      text-shadow: 2px 2px 0px #000;
      margin-top: -10px;
      text-align: center;
    }

    /* 常時表示フッター */
    .footer-credits {
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      color: #aaa;
      text-shadow: 1px 1px 0px #000;
      z-index: 10000;
      pointer-events: none;
    }

    /* タイトル落下演出 */
    .title-drop-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .title-drop-overlay.active {
      opacity: 1;
    }
    .title-card {
      transform: translateY(-500px) scale(0.5);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      background: rgba(0, 0, 0, 0.85);
      border: 6px solid #f8b800;
      box-shadow: 8px 8px 0px #000;
      padding: 20px;
      width: 90%;
      max-width: 700px;
    }
    .title-drop-overlay.active .title-card {
      transform: translateY(0) scale(1);
    }
    .main-title-text {
      font-size: 26px;
      color: #00f0f0;
      text-shadow: 4px 4px 0px #000, -2px -2px 0px #e60012;
      letter-spacing: 2px;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .sub-title-text {
      font-size: 16px;
      color: #f8b800;
      text-shadow: 2px 2px 0px #000;
      letter-spacing: 1px;
    }

    /* UIレイアウト */
    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      pointer-events: none;
    }
    .interactive { pointer-events: auto !important; }

    /* ヘッダー */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      padding: 8px 12px;
      border: 4px solid #fff;
      box-shadow: 4px 4px 0px #000;
    }
    .question-title {
      font-size: 16px;
      color: #00f0f0;
      text-shadow: 2px 2px 0px #000;
    }
    .header-controls { display: flex; gap: 6px; }
    .btn-small {
      font-family: 'DotGothic16', monospace;
      font-size: 12px;
      background: #333;
      color: #fff;
      border: 2px solid #fff;
      padding: 4px 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
    }
    .btn-small:hover { background: #555; }

    /* ステージバッジ */
    .stage-badges {
      display: flex;
      gap: 4px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .badge {
      width: 24px; height: 24px;
      background: #222;
      border: 2px solid #666;
      display: flex; justify-content: center; align-items: center;
      font-size: 12px; color: #888;
      box-shadow: 2px 2px 0px #000;
    }
    .badge.active {
      background: #f8b800; color: #000; border-color: #fff;
      font-weight: bold;
    }
    .badge.cleared { background: #00a800; color: #fff; border-color: #fff; }

    /* フッター */
    .footer-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.85);
      border: 4px solid #fff;
      padding: 8px;
      box-shadow: 4px 4px 0px #000;
    }
    .timer-container {
      width: 100%; max-width: 480px;
      background: #111;
      border: 3px solid #fff;
      padding: 2px;
      display: flex; align-items: center; gap: 6px;
    }
    .timer-bar-bg { flex: 1; height: 12px; background: #222; }
    .timer-bar-fill {
      width: 100%; height: 100%;
      background: #00ff88;
      transition: width 0.1s linear, background-color 0.2s;
    }
    .timer-text { font-size: 16px; width: 40px; text-align: right; color: #fff; }
    .timer-danger { background: #e60012 !important; }

    /* 解答フォーム */
    .input-form {
      display: flex; gap: 6px; width: 100%; max-width: 480px;
    }
    .answer-input {
      flex: 1;
      padding: 6px 10px;
      font-family: 'DotGothic16', monospace;
      font-size: 18px;
      border: 4px solid #fff;
      background: #000;
      color: #fff;
      outline: none;
      text-align: center;
    }

    /* 一画面収容リザルト表示 */
    .result-summary-box {
      width: 100%;
      max-width: 850px;
      flex: 1;
      margin: 6px 0;
      background: #111;
      border: 3px solid #fff;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px 8px;
      width: 100%;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #222;
      border: 2px solid #444;
      padding: 4px 8px;
      font-size: 12px;
    }

    /* モーダル */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 100000;
      display: flex; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #111;
      border: 4px solid #fff;
      box-shadow: 6px 6px 0px #000;
      padding: 16px;
      width: 95%; max-width: 650px;
      max-height: 85vh;
      overflow-y: auto;
      color: #fff;
    }
    .hidden { display: none !important; }

    table.log-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table.log-table th, table.log-table td {
      border: 2px solid #555;
      padding: 4px;
      text-align: left;
      font-size: 12px;
    }
    table.log-table th { background: #333; color: #f8b800; }

    @media (max-height: 550px) {
      .header-bar { padding: 4px 8px; }
      .question-title { font-size: 14px; }
      .footer-area { gap: 4px; padding: 6px; margin-bottom: 12px; }
      .timer-container { height: 16px; }
      .answer-input { font-size: 16px; padding: 4px; }
      .retro-btn { padding: 4px 12px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="bg-canvas"></canvas>

  <!-- スタート画面 -->
  <div class="start-overlay" id="start-overlay">
    <div class="start-title">直感で印象を答えろ！直感でGO！</div>
    <div class="start-subtitle">Powered by 基礎心理学ゼミ11班</div>
    <button class="retro-btn" id="start-btn">GAME START</button>
  </div>

  <!-- タイトル落下演出 -->
  <div class="title-drop-overlay" id="title-drop-overlay">
    <div class="title-card">
      <div class="main-title-text">直感を表情で読み取れ！<br>直感GO！</div>
      <div class="sub-title-text">Powered by 基礎心理学11班</div>
    </div>
  </div>

  <!-- リザルト画面 -->
  <div class="result-overlay hidden" id="result-overlay">
    <div>
      <div class="start-title" style="color:#f8b800; font-size:24px; margin-top: 10px;">全問題終了！</div>
    </div>
    <div class="result-summary-box" id="result-summary"></div>
    <button class="retro-btn" id="restart-btn" style="margin-bottom: 10px;">最初から遊ぶ</button>
  </div>

  <!-- UIレイアウト -->
  <div class="ui-layer">
    <div>
      <div class="header-bar interactive">
        <div class="question-title">この画像から受ける印象は？</div>
        <div class="header-controls">
          <button class="btn-small" id="bgm-toggle">BGM: OFF</button>
          <button class="btn-small" id="admin-btn">⚙ 管理設定</button>
        </div>
      </div>
      <div class="stage-badges" id="badges-container"></div>
    </div>

    <div class="footer-area interactive">
      <div class="timer-container">
        <div class="timer-bar-bg">
          <div class="timer-bar-fill" id="timer-bar"></div>
        </div>
        <div class="timer-text" id="timer-text">7.0</div>
      </div>
      <div class="input-form">
        <input type="text" class="answer-input" id="answer-input" placeholder="印象を入力して決定" autocomplete="off">
        <button type="button" class="retro-btn" id="submit-btn">決定</button>
      </div>
    </div>
  </div>

  <!-- 常時表示フッター -->
  <div class="footer-credits">
    2026 基礎心理学ゼミ11班 / Google Gemini / Open AI Chat GPT
  </div>
</div>

<!-- 管理者設定モーダル -->
<div class="modal hidden interactive" id="admin-modal">
  <div class="modal-content">
    <h2 style="color: #f8b800; margin-bottom: 12px; font-size: 18px;">管理者設定</h2>
    
    <div id="admin-auth">
      <p style="margin-bottom: 8px; font-size: 14px;">管理者パスワードを入力してください</p>
      <input type="password" id="admin-pass-input" placeholder="パスワード" style="width: 100%; padding: 6px; margin-bottom: 12px; font-family:'DotGothic16', monospace; font-size:14px;">
      <button class="btn-small" id="admin-login-btn">ログイン</button>
      <button class="btn-small" id="admin-close-btn" style="margin-left: 6px;">閉じる</button>
    </div>

    <div id="admin-panel" class="hidden">
      <div style="display:flex; gap:6px; margin-bottom:12px;">
        <button class="btn-small" id="tab-questions-btn" style="background:#f8b800; color:#000;">問題・BGM管理</button>
        <button class="btn-small" id="tab-logs-btn">📊 回答ログ確認</button>
      </div>

      <!-- 問題・BGM追加・管理タブ -->
      <div id="tab-questions-content">
        <h3 style="font-size: 14px;">BGM設定 (全プレイヤー共通)</h3>
        <div style="display: flex; flex-direction: column; gap: 6px; margin: 8px 0 16px 0;">
          <input type="file" id="bgm-file-input" accept="audio/*" style="font-size: 12px;">
          <button class="btn-small" id="upload-bgm-btn" style="background:#f8b800; color:#000;">BGMをサーバーに保存</button>
        </div>

        <h3 style="font-size: 14px;">問題追加</h3>
        <div style="display: flex; flex-direction: column; gap: 6px; margin: 8px 0 16px 0;">
          <input type="text" id="new-title" placeholder="タイトル（例: 画像①）" style="padding: 6px; font-family:'DotGothic16', monospace; font-size: 14px;">
          <input type="file" id="new-img-file" accept="image/*" style="font-size: 12px;">
          <button class="btn-small" id="add-q-btn">問題を追加</button>
        </div>
        <h3 style="font-size: 14px;">サーバー上の問題リスト</h3>
        <div id="q-list" style="margin-top: 8px;"></div>
      </div>

      <!-- 回答ログ閲覧タブ -->
      <div id="tab-logs-content" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-size: 14px;">スプレッドシート回答記録</h3>
          <button class="btn-small" onclick="renderLogs()">🔄 再読み込み</button>
        </div>
        <div id="log-list-container"></div>
      </div>

      <button class="btn-small" id="admin-logout-btn" style="margin-top: 16px;">設定を閉じる</button>
    </div>
  </div>
</div>

<script>
// --- GAS 連携 URL ---
const GAS_URL = "https://script.google.com/macros/s/AKfycbzIG8PIwSxkeRpbBP6wDCJrBZ-lV3TlgCet5EthJSur916CmGv7jOm9r3AjAbVtvw6x/exec";

// --- スマホキーボード対応 (Visual Viewport API) ---
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const container = document.getElementById('game-container');
    container.style.height = window.visualViewport.height + 'px';
    window.scrollTo(0, 0);
  });
}

// --- サーバー連動オーディオ (BGM) ---
let bgmAudio = null;
let bgmEnabled = false;
let serverBgmUrl = "";

function playAudioBGM() {
  if (!bgmEnabled || !serverBgmUrl) return;
  if (!bgmAudio) {
    bgmAudio = new Audio(serverBgmUrl);
    bgmAudio.loop = true;
  }
  bgmAudio.play().catch(err => console.log("BGM再生待機中:", err));
}

function stopAudioBGM() {
  if (bgmAudio) {
    bgmAudio.pause();
    bgmAudio.currentTime = 0;
  }
}

// --- 初期データ & キャッシュ処理 ---
let questions = [];
let imageCache = {};
let localAnswers = [];

let currentQIndex = 0;
let timeLimit = 7.0;
let timeRemaining = timeLimit;
let timerInterval = null;
let gameStarted = false;
let isPaused = false;

function preloadAllImages() {
  questions.forEach(q => {
    if (q.img && !imageCache[q.id]) {
      const img = new Image();
      img.src = q.img;
      imageCache[q.id] = img;
    }
  });
}

async function fetchConfigFromGAS() {
  try {
    const res = await fetch(GAS_URL + "?action=getConfig");
    const data = await res.json();
    if (data) {
      if (Array.isArray(data.questions) && data.questions.length > 0) {
        questions = data.questions;
        preloadAllImages();
      }
      if (data.bgmUrl) {
        serverBgmUrl = data.bgmUrl;
      }
    }
  } catch (err) {
    console.warn("サーバー設定の取得に失敗しました:", err);
  }
}

fetchConfigFromGAS();

// --- Canvas背景描画（惑星・星・ワープ演出） ---
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let bgOffset = 0;
let cardScale = 0.1;
let loadedImg = null;
let shipYOffset = 0;

// 星の生成
const stars = Array.from({ length: 70 }, () => ({
  x: Math.random() * 1000,
  y: Math.random() * 750,
  size: Math.random() * 2.5 + 1,
  speed: Math.random() * 1.5 + 0.5,
  color: ['#ffffff', '#00f0f0', '#f8b800', '#ff3344'][Math.floor(Math.random() * 4)]
}));

// 惑星の生成
const planets = [
  { x: 150, y: 120, radius: 28, color: '#e60012', ring: true, speed: 0.3 },
  { x: 800, y: 500, radius: 45, color: '#0088cc', ring: false, speed: 0.2 },
  { x: 700, y: 180, radius: 20, color: '#f8b800', ring: false, speed: 0.4 },
  { x: 250, y: 600, radius: 35, color: '#9900ff', ring: true, speed: 0.25 }
];

function resizeCanvas() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawScene() {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h * 0.35;

  if (!isPaused) {
    bgOffset += 4;
    shipYOffset += 0.05;
  }

  // 宇宙の背景色
  ctx.fillStyle = '#030310';
  ctx.fillRect(0, 0, w, h);

  // 1. 流れる星屑（背景の星）
  stars.forEach(star => {
    if (!isPaused) {
      star.y += star.speed;
      if (star.y > h) { star.y = 0; star.x = Math.random() * w; }
    }
    ctx.fillStyle = star.color;
    ctx.fillRect(star.x, star.y, star.size, star.size);
  });

  // 2. 惑星の描画
  planets.forEach(p => {
    if (!isPaused) {
      p.y += p.speed;
      if (p.y - p.radius > h) {
        p.y = -p.radius;
        p.x = Math.random() * w;
      }
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 惑星のクレーター風模様
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.arc(p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.25, 0, Math.PI * 2);
    ctx.arc(p.x + p.radius * 0.4, p.y + p.radius * 0.2, p.radius * 0.18, 0, Math.PI * 2);
    ctx.fill();

    // リング付き惑星（土星風）
    if (p.ring) {
      ctx.strokeStyle = '#f8b800';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.radius * 1.8, p.radius * 0.5, Math.PI / 6, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  });

  // 3. 3Dワープグリッド（ファイブツアーズ風）
  ctx.strokeStyle = '#1a2b56';
  ctx.lineWidth = 2;
  for (let i = -8; i <= 8; i++) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + i * (w / 4), h);
    ctx.stroke();
  }

  for (let i = 0; i < 6; i++) {
    let z = ((bgOffset + i * 80) % 480) / 480;
    let rectW = w * z;
    let rectH = h * z;
    let rectX = cx - rectW / 2;
    let rectY = cy - rectH * 0.3;

    ctx.strokeStyle = `hsl(${(bgOffset + i * 40) % 360}, 80%, 40%)`;
    ctx.lineWidth = 1 + z * 4;
    ctx.strokeRect(rectX, rectY, rectW, rectH);
  }

  // クイズ問題カードの描画
  if (gameStarted && currentQIndex < questions.length) {
    if (!isPaused && cardScale < 1.0) cardScale += 0.05;

    let cardW = Math.min(320, w * 0.75) * cardScale;
    let cardH = Math.min(220, h * 0.4) * cardScale;
    let cardX = cx - cardW / 2;
    let cardY = cy - cardH / 2 - 10;

    ctx.save();
    if (loadedImg && loadedImg.complete) {
      ctx.drawImage(loadedImg, cardX, cardY, cardW, cardH);
      ctx.strokeStyle = "#e60012";
      ctx.lineWidth = 4 * cardScale;
      ctx.strokeRect(cardX, cardY, cardW, cardH);
    } else {
      ctx.fillStyle = "#111";
      ctx.fillRect(cardX, cardY, cardW, cardH);
      ctx.strokeStyle = "#f8b800";
      ctx.lineWidth = 4 * cardScale;
      ctx.strokeRect(cardX, cardY, cardW, cardH);

      ctx.fillStyle = "#f8b800";
      ctx.font = `bold ${Math.floor(32 * cardScale)}px 'DotGothic16', monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const q = questions[currentQIndex];
      ctx.fillText(q ? q.title : "画像①", cx, cy - 10);
    }
    ctx.restore();
  }

  drawShip(cx, h * 0.68 + Math.sin(shipYOffset) * 6);
  requestAnimationFrame(drawScene);
}

function drawShip(x, y) {
  ctx.save();
  const p = 5.5;
  ctx.fillStyle = '#00f0f0';
  ctx.fillRect(x - 12 * p, y, 24 * p, 8 * p);
  ctx.fillStyle = '#0088cc';
  ctx.fillRect(x - 16 * p, y + 4 * p, 32 * p, 6 * p);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x - 6 * p, y - 4 * p, 12 * p, 5 * p);
  ctx.fillStyle = '#f8b800';
  ctx.fillRect(x - 4 * p, y - 2 * p, 8 * p, 3 * p);
  ctx.fillStyle = '#e60012';
  ctx.fillRect(x - 18 * p, y + 2 * p, 4 * p, 10 * p);
  ctx.fillRect(x + 14 * p, y + 2 * p, 4 * p, 10 * p);

  if (Math.floor(Date.now() / 100) % 2 === 0) {
    ctx.fillStyle = '#ff3300';
    ctx.fillRect(x - 8 * p, y + 10 * p, 6 * p, 6 * p);
    ctx.fillRect(x + 2 * p, y + 10 * p, 6 * p, 6 * p);
  }
  ctx.restore();
}

// --- ゲーム処理 ---
async function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  localAnswers = [];

  document.getElementById('start-overlay').style.display = 'none';
  document.getElementById('result-overlay').classList.add('hidden');

  if (bgmEnabled) playAudioBGM();

  const titleDropOverlay = document.getElementById('title-drop-overlay');
  titleDropOverlay.classList.add('active');

  const fetchPromise = fetchConfigFromGAS();

  setTimeout(async () => {
    await fetchPromise;
    if (questions.length === 0) {
      alert("サーバーに問題が登録されていません。管理者設定から問題を追加してください。");
    }
    titleDropOverlay.classList.remove('active');
    currentQIndex = 0;
    loadQuestion(0);
  }, 2500);
}

document.getElementById('start-btn').addEventListener('click', startGame);

document.getElementById('restart-btn').addEventListener('click', () => {
  gameStarted = false;
  stopAudioBGM();
  document.getElementById('start-overlay').style.display = 'flex';
  document.getElementById('result-overlay').classList.add('hidden');
});

function loadQuestion(index) {
  if (index >= questions.length) {
    showResultScreen();
    return;
  }
  
  const q = questions[currentQIndex];
  cardScale = 0.1;

  if (q && q.img) {
    if (imageCache[q.id]) {
      loadedImg = imageCache[q.id];
    } else {
      loadedImg = new Image();
      loadedImg.src = q.img;
      imageCache[q.id] = loadedImg;
    }
  } else {
    loadedImg = null;
  }

  renderBadges();
  resetTimer();
  
  setTimeout(() => {
    if (!isPaused) document.getElementById('answer-input').focus();
  }, 100);
}

function resetTimer() {
  clearInterval(timerInterval);
  timeRemaining = timeLimit;
  updateTimerUI();

  timerInterval = setInterval(() => {
    if (isPaused) return;

    timeRemaining -= 0.1;
    if (timeRemaining <= 0) {
      timeRemaining = 0;
      updateTimerUI();
      clearInterval(timerInterval);
      submitAndNext("(未回答 / 時間切れ)");
    } else {
      updateTimerUI();
    }
  }, 100);
}

function updateTimerUI() {
  const timerBar = document.getElementById('timer-bar');
  const timerText = document.getElementById('timer-text');
  const pct = (timeRemaining / timeLimit) * 100;
  timerBar.style.width = pct + "%";
  timerText.textContent = timeRemaining.toFixed(1);

  if (timeRemaining <= 3.0) {
    timerBar.classList.add('timer-danger');
  } else {
    timerBar.classList.remove('timer-danger');
  }
}

function handleAnswerSubmit() {
  if (isPaused) return;
  const inputEl = document.getElementById('answer-input');
  const userText = inputEl.value.trim() || "(未入力)";
  submitAndNext(userText);
}

function submitAndNext(userText) {
  clearInterval(timerInterval);

  const currentQ = questions[currentQIndex];
  const qTitle = currentQ ? currentQ.title : `問題${currentQIndex + 1}`;

  localAnswers.push({ title: qTitle, answer: userText });

  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      questionTitle: qTitle,
      userAnswer: userText
    })
  }).catch(err => console.error("GAS送信エラー:", err));

  document.getElementById('answer-input').value = "";
  currentQIndex++;
  loadQuestion(currentQIndex);
}

function showResultScreen() {
  clearInterval(timerInterval);
  stopAudioBGM();

  const resultBox = document.getElementById('result-summary');
  let html = `<div class="result-grid">`;
  localAnswers.forEach(item => {
    html += `
      <div class="result-item">
        <span style="color:#f8b800; font-weight:bold;">${item.title}</span>
        <span style="color:#00f0f0; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:55%; text-align:right;">${item.answer}</span>
      </div>`;
  });
  html += `</div>`;
  resultBox.innerHTML = html;

  document.getElementById('result-overlay').classList.remove('hidden');
}

function renderBadges() {
  const container = document.getElementById('badges-container');
  container.innerHTML = "";
  for (let i = 0; i < questions.length; i++) {
    const badge = document.createElement('div');
    badge.className = "badge";
    if (i < currentQIndex) badge.classList.add('cleared');
    if (i === currentQIndex) badge.classList.add('active');
    badge.textContent = i + 1;
    container.appendChild(badge);
  }
}

// --- イベント制御 ---
const answerInput = document.getElementById('answer-input');
const submitBtn = document.getElementById('submit-btn');

submitBtn.addEventListener('click', handleAnswerSubmit);

answerInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleAnswerSubmit();
  }
});

document.getElementById('bgm-toggle').addEventListener('click', () => {
  bgmEnabled = !bgmEnabled;
  document.getElementById('bgm-toggle').textContent = bgmEnabled ? "BGM: ON" : "BGM: OFF";
  if (bgmEnabled) {
    playAudioBGM();
  } else {
    stopAudioBGM();
  }
});

// --- 管理画面モーダル ---
function openAdminModal() {
  isPaused = true;
  stopAudioBGM();
  document.getElementById('admin-modal').classList.remove('hidden');
}

function closeAdminModal() {
  isPaused = false;
  document.getElementById('admin-modal').classList.add('hidden');
  if (gameStarted && bgmEnabled) {
    playAudioBGM();
    document.getElementById('answer-input').focus();
  }
}

document.getElementById('admin-btn').addEventListener('click', openAdminModal);
document.getElementById('admin-close-btn').addEventListener('click', closeAdminModal);
document.getElementById('admin-logout-btn').addEventListener('click', closeAdminModal);

document.getElementById('admin-login-btn').addEventListener('click', async () => {
  const pass = document.getElementById('admin-pass-input').value;
  if (pass === "kisosinri11") {
    document.getElementById('admin-auth').classList.add('hidden');
    document.getElementById('admin-panel').classList.remove('hidden');
    document.getElementById('admin-pass-input').value = "";
    await fetchConfigFromGAS();
    renderAdminList();
    renderLogs();
  } else {
    alert("パスワードが違います");
  }
});

document.getElementById('tab-questions-btn').addEventListener('click', () => {
  document.getElementById('tab-questions-content').classList.remove('hidden');
  document.getElementById('tab-logs-content').classList.add('hidden');
  document.getElementById('tab-questions-btn').style.background = "#f8b800";
  document.getElementById('tab-questions-btn').style.color = "#000";
  document.getElementById('tab-logs-btn').style.background = "#333";
  document.getElementById('tab-logs-btn').style.color = "#fff";
});

document.getElementById('tab-logs-btn').addEventListener('click', () => {
  document.getElementById('tab-questions-content').classList.add('hidden');
  document.getElementById('tab-logs-content').classList.remove('hidden');
  document.getElementById('tab-logs-btn').style.background = "#f8b800";
  document.getElementById('tab-logs-btn').style.color = "#000";
  document.getElementById('tab-questions-btn').style.background = "#333";
  document.getElementById('tab-questions-btn').style.color = "#fff";
  renderLogs();
});

// 共通BGMのサーバー保存
document.getElementById('upload-bgm-btn').addEventListener('click', () => {
  const fileInput = document.getElementById('bgm-file-input');
  if (!fileInput.files || !fileInput.files[0]) {
    alert("音楽ファイルを選択してください");
    return;
  }
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const audioData = e.target.result;
    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: "setBGM",
        bgmUrl: audioData
      })
    }).then(() => {
      alert("共通BGMをサーバーに保存しました！次回プレイ時から全プレイヤーに適用されます。");
      serverBgmUrl = audioData;
      fileInput.value = "";
    }).catch(err => console.error("BGM保存エラー:", err));
  };
  reader.readAsDataURL(fileInput.files[0]);
});

// 問題の追加
document.getElementById('add-q-btn').addEventListener('click', () => {
  const title = document.getElementById('new-title').value || `画像${questions.length + 1}`;
  const fileInput = document.getElementById('new-img-file');

  const sendToGAS = (imgData) => {
    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: "addQuestion",
        title: title,
        img: imgData || ""
      })
    }).then(() => {
      alert("問題を追加しました！");
      document.getElementById('new-title').value = "";
      fileInput.value = "";
      setTimeout(async () => {
        await fetchConfigFromGAS();
        renderAdminList();
        renderBadges();
      }, 1000);
    }).catch(err => console.error("追加エラー:", err));
  };

  if (fileInput.files && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => sendToGAS(e.target.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    sendToGAS("");
  }
});

function renderAdminList() {
  const list = document.getElementById('q-list');
  list.innerHTML = "";
  questions.forEach((q) => {
    const item = document.createElement('div');
    item.style.cssText = "display:flex; justify-content:space-between; margin-bottom:4px; background:#333; padding:4px 6px; border:2px solid #555; font-size:12px;";
    item.innerHTML = `<span>${q.title}</span><button onclick="deleteQ('${q.id}')" style="color:#ff5555; cursor:pointer; background:none; border:none; font-family:'DotGothic16'; font-weight:bold;">削除</button>`;
    list.appendChild(item);
  });
}

async function renderLogs() {
  const container = document.getElementById('log-list-container');
  container.innerHTML = "<p style='color:#aaa; font-size:12px;'>スプレッドシートから取得中...</p>";

  try {
    const res = await fetch(GAS_URL);
    const logs = await res.json();

    if (!logs || logs.length === 0) {
      container.innerHTML = "<p style='margin-top:10px; color:#888; font-size:12px;'>まだ回答データはありません。</p>";
      return;
    }

    let html = `<table class="log-table"><tr><th>日時</th><th>問題</th><th>回答</th></tr>`;
    logs.slice().reverse().forEach(log => {
      html += `<tr><td>${log.timestamp}</td><td>${log.questionTitle}</td><td style="color:#00f0f0; font-weight:bold;">${log.userAnswer}</td></tr>`;
    });
    html += `</table>`;
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = "<p style='color:#ff5555; font-size:12px;'>スプレッドシートからの取得に失敗しました。</p>";
  }
}

window.deleteQ = function(id) {
  if (!confirm("本当に削除しますか？")) return;
  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      type: "deleteQuestion",
      id: id
    })
  }).then(() => {
    setTimeout(async () => {
      await fetchConfigFromGAS();
      renderAdminList();
      renderBadges();
    }, 1000);
  });
};

drawScene();
renderBadges();
</script>
